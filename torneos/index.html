<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximos Torneos y Eventos - Mundial 2026</title>
    <link rel="icon" href="/assets/2026_FIFA_World_Cup_emblem.png" type="image/png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/torneos/styles.css">
</head>
<body>

    <iframe src="/header.html" hidden onload="const doc = this.contentDocument;
    const header = (doc.body || doc).children[0];header.querySelectorAll('a').forEach(a => a.setAttribute('href', a.href));
    header.querySelectorAll('img').forEach(img => img.setAttribute('src', img.src));this.before(header);this.remove();">
    </iframe>

    <main class="events-main">
        <section class="events-hero">
            <h1>Próximos Torneos y Eventos</h1>
            <p>Explora las competiciones oficiales de la FIFA y accede a todas sus novedades, calendarios y entradas.</p>
        </section>

        <div id="events-grid" class="events-grid">
            <div class="status-msg">Cargando eventos oficiales...</div>
        </div>
    </main>

    <script src="/torneos/script.js"></script>
</body>
</html>
