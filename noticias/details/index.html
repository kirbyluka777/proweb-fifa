<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Noticia - FIFA World Cup 2026</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="styles.css">
    <script src="../../script.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <iframe src="../../header.html" hidden onload="
        const doc = this.contentDocument;
        const header = (doc.body || doc).children[0];
        header.querySelectorAll('a').forEach(a => a.setAttribute('href', a.href));
        header.querySelectorAll('img').forEach(img => img.setAttribute('src', img.src));
        this.before(header);
        this.remove();
    "></iframe>

    <main>
        <a class="news-back" href="../index.html">← Volver a noticias</a>
        <article class="news-detail" id="news-detail"></article>
    </main>
</body>
</html>
