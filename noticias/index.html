<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Noticias - FIFA World Cup 2026</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/noticias/styles.css">
    <script src="/script.js" defer></script>
    <script src="/noticias/script.js" defer></script>
</head>
<body>
    <iframe src="/header.html" hidden onload="
        const doc = this.contentDocument;
        const header = (doc.body || doc).children[0];
        const currentPath = window.location.pathname.replace(/\/index\.html$/, '/');
        header.querySelectorAll('a').forEach(a => {
            a.setAttribute('href', a.href);
            const linkPath = new window.URL(a.href).pathname.replace(/\/index\.html$/, '/');
            if (linkPath === currentPath) {
                a.classList.add('nav-active');
            }
        });
        header.querySelectorAll('img').forEach(img => img.setAttribute('src', img.src));
        this.before(header);
        this.remove();
    "></iframe>

    <main>
        <a class="pull-tab" href="https://www.un.org/sustainabledevelopment/es/news/">
        <img src="/assets/un-logo-white.png" alt="UN Logo" class="tab-icon" />
        <span>ODS : Conoce las noticias</span>
        </a>
        <header class="page-header">
            <p class="page-eyebrow">Copa Mundial de la FIFA 2026</p>
            <h1>Últimas noticias</h1>
            <p>Historias, protagonistas y actualidad desde Canadá, México y Estados Unidos.</p>
        </header>

        <section class="news-feature" id="news-feature" aria-label="Noticia destacada"></section>

        <section class="news-latest" aria-labelledby="latest-title">
            <div class="news-section-heading">
                <p class="news-eyebrow">En portada</p>
                <h2 id="latest-title">Más historias</h2>
            </div>
            <div class="grid news-grid" id="news-grid"></div>
        </section>
    </main>
</body>
</html>
