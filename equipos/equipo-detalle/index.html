<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plantilla y datos de la selección participante en la Copa Mundial de la FIFA 2026.">
    <title>Detalle de Equipo - FIFA World Cup 2026</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/equipos/equipo-detalle/styles.css">
    <script src="/script.js" defer></script>
</head>
<body>
    <iframe src="/header.html" hidden onload="
        const doc = this.contentDocument;
        const header = (doc.body || doc).children[0];
        header.querySelectorAll('a').forEach(a => {
            a.setAttribute('href', a.href);
            if (new window.URL(a.href).pathname.includes('/equipos/')) {
                a.classList.add('nav-active');
            }
        });
        header.querySelectorAll('img').forEach(img => img.setAttribute('src', img.src));
        header.querySelectorAll('source').forEach(source => source.setAttribute('src', source.src));
        this.before(header);
        this.remove();
    "></iframe>

    <main class="team-detail-page" id="team-detail" aria-live="polite" aria-busy="true">
        <a class="back-link" href="/equipos/">
            <span aria-hidden="true">←</span>
            Volver a equipos
        </a>

        <div class="detail-status">
            <span class="loading-spinner" aria-hidden="true"></span>
            <p>Cargando información del equipo...</p>
        </div>
    </main>

    <script src="/equipos/equipo-detalle/script.js?v=4"></script>
</body>
</html>
