<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Equipos - FIFA World Cup</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <iframe src="../header.html" hidden onload="
        const doc = this.contentDocument;
        const header = (doc.body || doc).children[0];
        const currentPath = window.location.pathname.replace(/\/index\.html$/, '/');
        header.querySelectorAll('a').forEach(a => {
            a.setAttribute('href', a.href);
            const linkPath = new window.URL(a.href).pathname.replace(/\/index\.html$/, '/');
            if (linkPath === currentPath) {
                a.classList.add('nav-active');
            }
        });
        header.querySelectorAll('img').forEach(img => img.setAttribute('src', img.src));
        this.before(header);
        this.remove();
    "></iframe>
    <main>
        <div style="margin-bottom:1rem;">
            <label>Filtrar por Confederación: </label>
            <select><option>CONMEBOL</option><option>CONCACAF</option><option>UEFA</option></select>
        </div>
        <div class="grid">
            <div class="card">
                <h3>Argentina</h3>
                <p>Grupo C | Ranking FIFA: 1 | Participaciones: 18</p>
                <a href="equipo-detalle/index.html" class="btn">Ver Equipo</a>
            </div>
            <!-- Más equipos -->
        </div>
    </main>
</body>
</html>
