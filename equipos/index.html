<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Selecciones participantes de la Copa Mundial de la FIFA 2026.">
    <title>Equipos - FIFA World Cup 2026</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <iframe src="../header.html " hidden onload="
        const doc = this.contentDocument;
        const header = (doc.body || doc).children[0];
        const normalizePath = path => path.replace(/\/index\.html$/, '/').replace(/\/?$/, '/');
        const currentPath = normalizePath(window.location.pathname);
        header.querySelectorAll('a').forEach(a => {
            a.setAttribute('href', a.href);
            const linkPath = normalizePath(new window.URL(a.href).pathname);
            if (linkPath === currentPath) {
                a.classList.add('nav-active');
            }
        });
        header.querySelectorAll('img').forEach(img => img.setAttribute('src', img.src));
        header.querySelectorAll('source').forEach(source => source.setAttribute('src', source.src));
        this.before(header);
        this.remove();
    "></iframe>

    <main class="teams-page">
        <header class="page-header teams-heading">
            <p class="page-eyebrow">Copa Mundial de la FIFA 2026</p>
            <h1 id="teams-title">Equipos</h1>
            <p>Conoce las 48 selecciones participantes, su grupo y su trayectoria mundialista.</p>
        </header>

        <section class="teams-controls" aria-label="Filtros de equipos">
            <div class="filter-heading">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24">
                    <path d="M4 5h16l-6.2 7.1V18l-3.6 1.8v-7.7L4 5Z"/>
                </svg>
                <span>Confederación</span>
            </div>
            <div class="filter-list" id="confederation-filter">
                <button type="button" class="filter-button active" data-confederation="all" aria-pressed="true">Todas</button>
                <button type="button" class="filter-button" data-confederation="AFC" aria-pressed="false">AFC</button>
                <button type="button" class="filter-button" data-confederation="CAF" aria-pressed="false">CAF</button>
                <button type="button" class="filter-button" data-confederation="CONCACAF" aria-pressed="false">Concacaf</button>
                <button type="button" class="filter-button" data-confederation="CONMEBOL" aria-pressed="false">Conmebol</button>
                <button type="button" class="filter-button" data-confederation="OFC" aria-pressed="false">OFC</button>
                <button type="button" class="filter-button" data-confederation="UEFA" aria-pressed="false">UEFA</button>
            </div>
            <p class="results-count" id="results-count" aria-live="polite"></p>
        </section>

        <section class="countries-grid" id="teams-grid" aria-live="polite" aria-busy="true">
            <div class="teams-status">
                <span class="loading-spinner" aria-hidden="true"></span>
                <p>Cargando selecciones...</p>
            </div>
        </section>
    </main>

    <script src="/equipos/script.js?v=4"></script>
</body>
</html>
