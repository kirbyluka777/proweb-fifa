<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciudades Anfitrionas - FIFA World Cup 2026</title>
    <link rel="icon" href="/assets/2026_FIFA_World_Cup_emblem.png" type="image/png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/ciudades/styles.css">
    <script src="/script.js" defer></script>
</head>
<body>

    <iframe src="/header.html" hidden onload="
        const doc = this.contentDocument;
        const header = (doc.body || doc).children[0];
        const currentPath = window.location.pathname.replace(/\/index\.html$/, '/');
        header.querySelectorAll('a').forEach(a => {
            a.setAttribute('href', a.href);
            const linkPath = new window.URL(a.href).pathname.replace(/\/index\.html$/, '/');
            if (linkPath === currentPath) {
                a.classList.add('nav-active');
            }
        });
        header.querySelectorAll('img').forEach(img => img.setAttribute('src', img.src));
        this.before(header);
        this.remove();
    "></iframe>

    <main>
        <a class="pull-tab" href="https://www.un.org/sustainabledevelopment/es/news/">
        <img src="/assets/un-logo-white.png" alt="UN Logo" class="tab-icon" />
        <span>Conoce como estas ciudades promueven la infraestructura sostenible</span>
        </a>
        <!-- Filtro por País -->
        <div class="filter-container">
            <select id="country-filter" class="filter-select">
                <option value="">Todos los Países</option>
                <option value="Canada">Canadá</option>
                <option value="United States">Estados Unidos</option>
                <option value="Mexico">México</option>
            </select>
        </div>

        <!-- Contenedor dinámico de Ciudades -->
        <div class="grid" id="cities-grid">
            <p class="status-msg">Cargando ciudades anfitrionas...</p>
        </div>
    </main>

    <script src="/ciudades/script.js"></script>
</body>
</html>
