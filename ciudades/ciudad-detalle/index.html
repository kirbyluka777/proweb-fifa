<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Ciudad - Mundial 2026</title>
    <link rel="icon" href="/assets/2026_FIFA_World_Cup_emblem.png" type="image/png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/ciudades/ciudad-detalle/styles.css">
    <script src="/script.js" defer></script>
</head>
<body>

    <header class="detalle-header">
        <a href="/ciudades/" class="btn-back">← Volver a Ciudades</a>
    </header>

    <main id="main-content">

        <div id="city-banner" class="banner">
            <div class="banner-dark-overlay"></div>
            <h1 id="city-title" class="banner-title">Cargando ciudad...</h1>
        </div>

        <div class="content-container">

            <section class="city-overview card-detalle">
                <div class="logo-container">
                    <img id="city-logo" src="" alt="Logo Ciudad Mundial" style="display: none;">
                </div>
                <div id="city-description" class="city-text">
                    <p class="status-msg">Cargando información de la ciudad...</p>
                </div>
            </section>

            <section id="stadium-section" class="stadium-info card-detalle" style="display: none;">
                <h2 id="stadium-name">Nombre del Estadio</h2>
                <div class="stadium-grid">
                    <div class="stadium-img-wrapper">
                        <img id="stadium-img" src="" alt="Foto Estadio">
                    </div>
                    <div class="stadium-data">
                        <p><strong>Capacidad:</strong> <span id="stadium-capacity">--</span></p>
                        <p><strong>Coordenadas:</strong> <span id="stadium-coords">--</span></p>
                        <div id="stadium-extra" class="extra-info"></div>
                    </div>
                </div>
            </section>

            <section class="matches-section card-detalle">
                <h3>Partidos en esta Ciudad</h3>
                <ul id="matches-list" class="matches-list">
                    <li class="status-msg">Buscando calendario de partidos...</li>
                </ul>
            </section>
        </div>
    </main>

    <script src="/ciudades/ciudad-detalle/script.js"></script>
</body>
</html>
