<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clasificación - FIFA World Cup 2026</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="styles.css">
    <script src="../script.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <iframe src="../header.html" hidden onload="
        const doc = this.contentDocument;
        const header = (doc.body || doc).children[0];
        const currentPath = window.location.pathname.replace(/\/index\.html$/, '/');
        header.querySelectorAll('a').forEach(a => {
            a.setAttribute('href', a.href);
            const linkPath = new window.URL(a.href).pathname.replace(/\/index\.html$/, '/');
            if (linkPath === currentPath) a.classList.add('nav-active');
        });
        header.querySelectorAll('img').forEach(img => img.setAttribute('src', img.src));
        this.before(header);
        this.remove();
    "></iframe>

    <main>
        <header class="page-header">
            <p class="page-eyebrow">Copa Mundial de la FIFA 2026</p>
            <h1>Clasificación</h1>
            <p>Consulta las posiciones de la fase de grupos y el camino hacia la final.</p>
        </header>

        <div class="classification-tabs" role="tablist" aria-label="Secciones de clasificación">
            <button
                class="classification-tab is-active"
                id="tables-tab"
                type="button"
                role="tab"
                aria-selected="true"
                aria-controls="tables-panel"
            >Tablas</button>
            <button
                class="classification-tab"
                id="brackets-tab"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="brackets-panel"
                tabindex="-1"
            >Llaves</button>
        </div>

        <section
            class="standings-section classification-panel"
            id="tables-panel"
            role="tabpanel"
            aria-labelledby="tables-tab"
        >
            <div class="standings-section__heading">
                <div>
                    <p class="standings-eyebrow">Fase de grupos</p>
                    <h2 id="groups-title">Tabla de posiciones</h2>
                </div>
                <div class="field">
                    <label for="group-filter">Mostrar grupos</label>
                    <select class="form-select" id="group-filter">
                        <option value="all">Todos los grupos</option>
                    </select>
                </div>
            </div>
            <div class="standings-grid" id="standings-grid"></div>
        </section>

        <section
            class="knockout-section classification-panel"
            id="brackets-panel"
            role="tabpanel"
            aria-labelledby="brackets-tab"
            hidden
        >
            <div class="standings-section__heading">
                <div>
                    <p class="standings-eyebrow">Eliminación directa</p>
                    <h2 id="knockout-title">Camino a la final</h2>
                </div>
                <p class="bracket-hint">Arrastra la ventana</p>
            </div>
            <div class="tournament-brackets-view" tabindex="0" aria-label="Llaves de eliminación directa">
                <div class="tournament-brackets" id="tournament-brackets"></div>
            </div>
        </section>
    </main>
</body>
</html>
