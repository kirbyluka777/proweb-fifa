<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Marcador, estadísticas, cronología y alineaciones del partido de la Copa Mundial de la FIFA 2026.">
    <title>Detalle del Partido - FIFA World Cup 2026</title>
    <link rel="icon" href="/assets/2026_FIFA_World_Cup_emblem.png" type="image/png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/partidos/partido-detalle/styles.css">
    <script src="/script.js" defer></script>
    <script src="/partidos/partido-detalle/scrip.js" defer></script>
</head>
<body>
    <iframe src="/header.html" hidden onload="
        const doc = this.contentDocument;
        const header = (doc.body || doc).children[0];
        header.querySelectorAll('a').forEach(a => {
            a.setAttribute('href', a.href);
            if (new window.URL(a.href).pathname.includes('/partidos/')) {
                a.classList.add('nav-active');
            }
        });
        header.querySelectorAll('img').forEach(img => img.setAttribute('src', img.src));
        header.querySelectorAll('source').forEach(source => source.setAttribute('src', source.src));
        this.before(header);
        this.remove();
    "></iframe>

    <main class="match-detail-page" id="match-detail" aria-live="polite" aria-busy="true">
        <a class="back-link" href="/partidos/">
            <span aria-hidden="true">←</span>
            Volver a partidos
        </a>

        <header class="match-header detail-card">
            <p class="match-eyebrow">Copa Mundial de la FIFA 2026</p>
            <h1>Cargando partido...</h1>
            <p class="loading-text">Consultando la información oficial del encuentro.</p>
        </header>

        <section class="pitch detail-card" aria-label="Alineación inicial">
            <div class="section-heading">
                <div>
                    <p>Once inicial</p>
                    <h2>Alineación del partido</h2>
                </div>
            </div>
            <div class="alert">Cargando alineaciones...</div>
        </section>

        <div class="match-insights">
            <section class="stats detail-card" aria-label="Estadísticas del partido">
                <div class="section-heading">
                    <div>
                        <p>Datos del juego</p>
                        <h2>Estadísticas</h2>
                    </div>
                </div>
            </section>

            <section class="timeline detail-card" aria-label="Cronología del partido">
                <div class="section-heading">
                    <div>
                        <p>Minuto a minuto</p>
                        <h2>Cronología</h2>
                    </div>
                </div>
            </section>
        </div>

        <section class="lineups-box detail-card" id="lineups-section">
            <div class="section-heading">
                <div>
                    <p>Planteles</p>
                    <h2>Alineaciones y dirección técnica</h2>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
