<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Partidos - FIFA World Cup 2026</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <iframe src="../header.html" hidden onload="
        const doc = this.contentDocument;
        const header = (doc.body || doc).children[0];
        const currentPath = window.location.pathname.replace(/\/index\.html$/, '/');
        header.querySelectorAll('a').forEach(a => {
            a.setAttribute('href', a.href);
            const linkPath = new window.URL(a.href).pathname.replace(/\/index\.html$/, '/');
            if (linkPath === currentPath) {
                a.classList.add('nav-active');
            }
        });
        header.querySelectorAll('img').forEach(img => img.setAttribute('src', img.src));
        this.before(header);
        this.remove();
    "></iframe>

    <main class="matches-page-wrapper">
        <div class="filters">
            <select id="filtro-ciudad"><option value="">Filtro: Ciudad</option></select>
            <select id="filtro-ronda"><option value="">Filtro: Ronda</option></select>
            <select id="filtro-estatus"><option value="">Filtro: Estatus</option></select>
            <select id="filtro-grupo"><option value="">Filtro: Grupo</option></select>
            <select id="filtro-equipo"><option value="">Filtro: Equipo</option></select>
            <button id="btn-aplicar-filtros" class="btn-slanted">Aplicar Filtros</button>
        </div>

        <section id="matches-container">
            <p class="loading-text">Cargando partidos...</p>
        </section>
    </main>

    <script src="scrip.js"></script>
</body>
</html>
