<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Partidos - FIFA World Cup 2026</title>
    <link rel="icon" href="/assets/2026_FIFA_World_Cup_emblem.png" type="image/png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/partidos/styles.css">
    <script src="/script.js" defer></script>
</head>
<body>
    <iframe src="/header.html" hidden onload="
        const doc = this.contentDocument;
        const header = (doc.body || doc).children[0];
        const currentPath = window.location.pathname.replace(/\/index\.html$/, '/');
        header.querySelectorAll('a').forEach(a => {
            a.setAttribute('href', a.href);
            const linkPath = new window.URL(a.href).pathname.replace(/\/index\.html$/, '/');
            if (linkPath === currentPath) {
                a.classList.add('nav-active');
            }
        });
        header.querySelectorAll('img').forEach(img => img.setAttribute('src', img.src));
        this.before(header);
        this.remove();
    "></iframe>

    <main>
        <header class="page-header">
            <span class="page-eyebrow">Copa Mundial de la FIFA 2026</span>
            <h1>CALENDARIO DE PARTIDOS</h1>
            <p>Explora el fixture oficial en tiempo real. Filtra por ciudad sede, ronda eliminatoria, grupo o selección nacional.</p>
        </header>

        <!-- Filter Controls -->
        <section class="filters" aria-labelledby="filters-title">
            <div class="filters__heading">
                <span class="matches-eyebrow">Búsqueda Avanzada</span>
                <h2 id="filters-title">Filtrar Partidos</h2>
            </div>

            <div class="filters__grid">
                <label class="field">
                    <span>Ciudad Sede</span>
                    <select class="form-select" id="filtro-ciudad">
                        <option value="">Todas las ciudades</option>
                    </select>
                </label>
                <label class="field">
                    <span>Ronda</span>
                    <select class="form-select" id="filtro-ronda">
                        <option value="">Todas las rondas</option>
                    </select>
                </label>
                <label class="field">
                    <span>Estatus</span>
                    <select class="form-select" id="filtro-estatus">
                        <option value="">Todos los estatus</option>
                    </select>
                </label>
                <label class="field">
                    <span>Grupo</span>
                    <select class="form-select" id="filtro-grupo">
                        <option value="">Todos los grupos</option>
                    </select>
                </label>
                <label class="field">
                    <span>Equipo</span>
                    <select class="form-select" id="filtro-equipo">
                        <option value="">Todos los equipos</option>
                    </select>
                </label>
                <button id="btn-aplicar-filtros" class="btn" type="button">APLICAR FILTROS</button>
            </div>
        </section>

        <!-- Dynamic Matches Grid -->
        <section class="matches-grid" id="matches-container" aria-live="polite" aria-label="Partidos">
            <p class="loading-text">Cargando partidos desde el servidor...</p>
        </section>
    </main>

    <script src="/partidos/scrip.js"></script>
</body>
</html>
