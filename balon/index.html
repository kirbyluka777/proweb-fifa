<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Balón Oficial</title>
    <script src="/script.js" defer></script>
    <script src="/balon/scrip.js" defer></script>
    <link rel="stylesheet" href="/balon/styles.css">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <iframe src="/header.html" hidden onload="const doc = this.contentDocument;
    const header = (doc.body || doc).children[0];header.querySelectorAll('a').forEach(a => a.setAttribute('href', a.href));
    header.querySelectorAll('img').forEach(img => img.setAttribute('src', img.src));this.before(header);this.remove();">
    </iframe>
    <main>
        <section class="ball-hero" aria-labelledby="title">
            <div class="ball-img">
                <img src="" id="img" alt="">
            </div>
            <div class="ball-hero__heading">
                <p class="ball-hero__eyebrow">Balón oficial del torneo</p>
                <h1 id="title"></h1>
            </div>
        </section>

        <section class="ball-features" aria-labelledby="features-title">
            <div class="ball-features__heading">
                <p class="ball-features__eyebrow">Conoce el balón</p>
                <h2 id="features-title">Diseñado para el juego</h2>
                <p class="ball-features__intro">Tecnología, precisión y una identidad creada para el escenario más grande.</p>
            </div>
            <div class="grid feature-grid" id="feature-grid" aria-live="polite">
                <p class="ball-status" id="ball-status">Cargando información del balón…</p>
            </div>
        </section>
    </main>
</body>
</html>
