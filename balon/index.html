<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Balón Oficial</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <iframe src="../header.html" hidden onload="const doc = this.contentDocument;
    const header = (doc.body || doc).children[0];header.querySelectorAll('a').forEach(a => a.setAttribute('href', a.href));
    header.querySelectorAll('img').forEach(img => img.setAttribute('src', img.src));this.before(header);this.remove();">
    </iframe>
    <main>
        <div style="text-align: center;">
            <img src="balon.png" alt="Foto del Balón Oficial" style="max-width:300px; border:1px solid #ccc;">
            <p>Descripción de la tecnología y el diseño utilizado en el balón oficial del torneo...</p>
        </div>
    </main>
</body>
</html>
