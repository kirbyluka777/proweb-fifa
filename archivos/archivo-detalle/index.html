<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video - Mundial 2026</title>
    <link rel="icon" href="/assets/2026_FIFA_World_Cup_emblem.png" type="image/png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/archivos/archivo-detalle/styles.css">
    <script src="/script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1" defer></script>
    <script src="/archivos/archivo-detalle/script.js" defer></script>
</head>
<body>
    <header class="detalle-header">
        <a href="/archivos/" class="btn-back">← Volver al Catálogo</a>
    </header>

    <main class="player-main">
        <div id="loading-container" class="status-msg">Cargando reproductor de video...</div>

        <article id="record-detail-card" class="record-detail-card" style="display: none;">

            <div class="video-responsive-wrapper">
                <video id="video-player" controls playsinline preload="metadata" hidden></video>
                <iframe id="video-iframe" src="" title="Reproductor de Video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen hidden></iframe>
            </div>

            <div class="record-info-section">
                <div class="text-data">
                    <span id="record-subtitle" class="badge-subtitle">Resumen</span>
                    <h1 id="record-title" class="title-main">Título del Video</h1>
                    <p id="record-desc" class="desc-text">Descripción detallada del archivo o partido.</p>
                </div>

                <div class="logo-box">
                    <img id="tournament-logo" src="https://digitalhub.fifa.com/transform/c0288b07-db6c-4081-9fc1-9667bb20bb35/Tournament-thumbnail-4_3-1570px_1178px" alt="Logo Torneo">
                    <span>Torneo Oficial</span>
                </div>
            </div>

        </article>
    </main>
</body>
</html>
