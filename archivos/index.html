<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivos y Resúmenes del Torneo - Mundial 2026</title>
    <link rel="icon" href="/assets/2026_FIFA_World_Cup_emblem.png" type="image/png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/archivos/styles.css">
</head>
<body>
    <!-- Inyección dinámica de tu Header -->
    <iframe src="/header.html" hidden onload="const doc = this.contentDocument;
    const header = (doc.body || doc).children[0];header.querySelectorAll('a').forEach(a => a.setAttribute('href', a.href));
    header.querySelectorAll('img').forEach(img => img.setAttribute('src', img.src));this.before(header);this.remove();">
    </iframe>

    <main class="archives-main">
        <section class="archives-hero">
            <h1>Archivos del Torneo</h1>
            <p>Revive los mejores momentos, goles inolvidables y resúmenes de partidos históricos de la Copa Mundial.</p>
        </section>

        <!-- Contenedor dinámico de los videos -->
        <div id="records-grid" class="records-grid">
            <div class="status-msg">Cargando catálogo de videos...</div>
        </div>
    </main>

    <script src="/archivos/script.js"></script>
</body>
</html>
