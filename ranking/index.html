<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ranking FIFA</title>
    <link rel="stylesheet" href="../styles.css">
    <style> table { width: 100%; border-collapse: collapse; } th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; } th { background: #eee; } </style>

</head>
<body>
    <iframe src="../header.html" hidden onload="
        const doc = this.contentDocument;
        const header = (doc.body || doc).children[0];
        const currentPath = window.location.pathname.replace(/\/index\.html$/, '/');
        header.querySelectorAll('a').forEach(a => {
            a.setAttribute('href', a.href);
            const linkPath = new window.URL(a.href).pathname.replace(/\/index\.html$/, '/');
            if (linkPath === currentPath) {
                a.classList.add('nav-active');
            }
        });
        header.querySelectorAll('img').forEach(img => img.setAttribute('src', img.src));
        this.before(header);
        this.remove();
    "></iframe>
    <main>
        <table>
            <tr><th>Posición</th><th>Equipo</th><th>Puntos</th></tr>
            <tr><td>1</td><td>Argentina</td><td>1855.20</td></tr>
            <tr><td>2</td><td>Francia</td><td>1845.44</td></tr>
        </table>
    </main>
</body>
</html>
